name: release

# Every commit to main publishes a pre-release built entirely from src/ —
# nothing is downloaded and no payload binary is committed or published:
#
#   src/payload (Java source)              -> vape_client.jar   (Maven + shade)
#   vape_client.jar                        -> bundle.dat        (bundle.py)
#   src/injector/ui_win32.c + injection    -> injector.exe      (mingw + embed.py)
#   src/injector/java_agent (Java source)  -> agent.jar         (for macOS/Linux)
#
# Assets: injector.exe (Windows, native UI, payload inside it) + agent.jar.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  payload:
    name: payload (built from src/payload)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile the client from source
        run: mvn -B -q -f src/payload/pom.xml package

      - name: Report
        run: |
          jar=src/payload/target/vape_client.jar
          ls -l "$jar"
          sha256sum "$jar"
          unzip -l "$jar" | tail -1

      - uses: actions/upload-artifact@v4
        with:
          name: payload
          path: src/payload/target/vape_client.jar
          if-no-files-found: error

  windows:
    name: windows injector (native ui)
    needs: payload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: payload
          path: payload

      - name: Install the mingw-w64 cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Bundle the payload
        run: python3 src/injector/bundle.py payload/vape_client.jar -o bundle.dat

      - name: Verify the injection logic (same sources, native build)
        run: make test

      - name: Build injector.exe (native ui + injection logic + payload)
        run: |
          make windows
          make verify

      - uses: actions/upload-artifact@v4
        with:
          name: injector
          path: dist/injector.exe
          if-no-files-found: error

  agent:
    name: java agent (macOS / Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build the agent from source
        run: make agent

      - name: Smoke-test premain (no display here, splash switched off)
        run: |
          java -Dskid.splash=false \
               -javaagent:src/injector/java_agent/agent.jar=verbose \
               -cp src/injector/java_agent Probe

      - uses: actions/upload-artifact@v4
        with:
          name: agent
          path: src/injector/java_agent/agent.jar
          if-no-files-found: error

  release:
    name: pre-release
    needs: [windows, agent]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble the assets
        run: |
          mkdir -p release
          cp artifacts/injector/injector.exe release/injector.exe
          cp artifacts/agent/agent.jar release/agent.jar
          ls -l release

      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-$(echo "$GITHUB_SHA" | cut -c1-7)"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "$tag" \
              --generate-notes \
              release/*
          fi
